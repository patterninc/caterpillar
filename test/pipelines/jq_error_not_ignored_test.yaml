# Covers a critical query error with fail_on_error left off: the bad record ends the
# task, yet the run is still attested as successful.
tasks:
  - name: read_names
    type: file
    path: test/pipelines/names.txt
  - name: split_to_lines
    type: split
    delimiter: "\n"
  - name: first_ten
    type: sample
    filter: head
    limit: 10
  - name: raise_on_match
    type: jq
    ignore_error: false
    path: |
      if . == "Abby" then
        error("unexpected name: \(.)")
      else . end
  - name: echo
    type: echo
    only_data: true
