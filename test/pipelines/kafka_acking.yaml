# number: 7 is not a divisor of exploded record counts, so a remainder is still buffered when the reader stops.

tasks:
  - name: kafka_read
    type: kafka
    bootstrap_server: '{{ secret "/kafka/server" }}:9094'
    topic: test-caterpillar-topic
    group_id: test-caterpillar-group-acking
    user_auth_type: scram
    username: test-caterpillar
    password: {{ secret "/kafka/test-caterpillar/secret" }}
    server_auth_type: tls
    timeout: 2s
    max_records: 10
    end_after: 30s
    auto_offset_reset: earliest
    cert: |
      {{ indent 6 (secret "/kafka/ca-cert") }}

  - name: explode_items
    type: jq
    path: '.items'
    explode: true

  - name: batch
    type: join
    number: 7
    delimiter: "\n"

  - name: save
    type: file
    path: ./output/kafka_acking/{{ macro "uuid" }}.json

dag: kafka_read >> explode_items >> batch >> save
