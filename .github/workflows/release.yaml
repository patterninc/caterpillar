name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'

jobs:
  # Builds the linux/arm64 (AWS Graviton) binary natively on a GitHub-hosted
  # ARM runner, so cgo and the bundled glibc_linux_arm64 librdkafka link without
  # cross-compiling. On tags the binary is handed to the release job as a
  # workflow artifact and published as the `caterpillar-linux-arm64` asset.
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build caterpillar
      run: |
        CGO_ENABLED=1 GOOS=linux go build -o caterpillar-linux-arm64 ./cmd/caterpillar/caterpillar.go

    - name: Verify architecture
      run: |
        out="$(file caterpillar-linux-arm64)"
        echo "$out"
        case "$out" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "::error::caterpillar-linux-arm64 is not an ARM aarch64 ELF binary"; exit 1 ;;
        esac
        ./caterpillar-linux-arm64 -conf test/pipelines/hello_name.yaml

    - name: Upload binary for the release job
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: caterpillar-linux-arm64
        path: caterpillar-linux-arm64
        if-no-files-found: error
        retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build-linux-arm64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.7'
        
    - name: Build caterpillar
      run: |
        CGO_ENABLED=1 GOOS=linux go build -o caterpillar ./cmd/caterpillar/caterpillar.go

    - name: Verify architecture
      run: |
        out="$(file caterpillar)"
        echo "$out"
        case "$out" in
          *"ELF 64-bit"*"x86-64"*) ;;
          *) echo "::error::caterpillar is not an x86-64 ELF binary"; exit 1 ;;
        esac
        ./caterpillar -conf test/pipelines/hello_name.yaml

    - name: Download linux/arm64 binary
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/download-artifact@v4
      with:
        name: caterpillar-linux-arm64

    - name: Verify linux/arm64 binary architecture
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        out="$(file caterpillar-linux-arm64)"
        echo "$out"
        case "$out" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "::error::caterpillar-linux-arm64 is not an ARM aarch64 ELF binary"; exit 1 ;;
        esac

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          caterpillar
          caterpillar-linux-arm64
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: tagger
      uses: docker/metadata-action@v5
      with:
        images: patternoss/caterpillar
        tags: |
          type=semver,pattern={{major}}.{{minor}}.{{patch}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./build/Dockerfile
        push: true
        tags: ${{ steps.tagger.outputs.tags }}
        platforms: linux/amd64,linux/arm64
