name: Release

# Pushes to main build and verify both release binaries, so a broken build is
# caught before a tag is cut. Pushes of v* tags also publish both binaries as
# assets of the GitHub release for that tag.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'

permissions:
  contents: read

# One run per ref. A newer push to main replaces a run still in progress; a
# tag run is never cancelled part-way through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  # Builds the x86-64 binary, published as the `caterpillar` asset. The asset
  # name must not change: downstream images download it by name. The runner is
  # pinned (rather than ubuntu-latest) so the binary's glibc baseline only
  # changes when we choose to change it.
  build-linux-amd64:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build caterpillar
      run: |
        CGO_ENABLED=1 GOOS=linux go build -o caterpillar ./cmd/caterpillar/caterpillar.go

    - name: Verify architecture
      run: |
        out="$(file caterpillar)"
        echo "$out"
        case "$out" in
          *"ELF 64-bit"*"x86-64"*) ;;
          *) echo "::error::caterpillar is not an x86-64 ELF binary"; exit 1 ;;
        esac
        ./caterpillar -conf test/pipelines/hello_name.yaml

    - name: Upload binary for the release job
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: caterpillar
        path: caterpillar
        if-no-files-found: error
        retention-days: 1

  # Builds the linux/arm64 (AWS Graviton) binary natively on a GitHub-hosted
  # ARM runner, so cgo and the bundled glibc_linux_arm64 librdkafka link without
  # cross-compiling. Published as the `caterpillar-linux-arm64` asset.
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build caterpillar
      run: |
        CGO_ENABLED=1 GOOS=linux go build -o caterpillar-linux-arm64 ./cmd/caterpillar/caterpillar.go

    - name: Verify architecture
      run: |
        out="$(file caterpillar-linux-arm64)"
        echo "$out"
        case "$out" in
          *"ELF 64-bit"*"ARM aarch64"*) ;;
          *) echo "::error::caterpillar-linux-arm64 is not an ARM aarch64 ELF binary"; exit 1 ;;
        esac
        ./caterpillar-linux-arm64 -conf test/pipelines/hello_name.yaml

    - name: Upload binary for the release job
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: caterpillar-linux-arm64
        path: caterpillar-linux-arm64
        if-no-files-found: error
        retention-days: 1

  # Tags only: publishes both binaries in a single release call, so two jobs
  # never create or update the release at the same time. This is the only job
  # with write access, and it runs no repository code.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Download x86-64 binary
      uses: actions/download-artifact@v8
      with:
        name: caterpillar

    - name: Download linux/arm64 binary
      uses: actions/download-artifact@v8
      with:
        name: caterpillar-linux-arm64

    - name: Verify architectures
      run: |
        check() {
          out="$(file "$1")"
          echo "$out"
          case "$out" in
            *"ELF 64-bit"*"$2"*) ;;
            *) echo "::error::$1 is not a $2 ELF binary"; exit 1 ;;
          esac
        }
        check caterpillar x86-64
        check caterpillar-linux-arm64 "ARM aarch64"

    - name: Create Release
      # softprops/action-gh-release v3.0.3, pinned to a commit because this
      # third-party action runs with a token that can write releases.
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        files: |
          caterpillar
          caterpillar-linux-arm64
        fail_on_unmatched_files: true
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
