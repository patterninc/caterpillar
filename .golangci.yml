# golangci-lint v2 configuration. CI runs it with `make lint`, which reports
# only issues introduced since LINT_BASE (the PR's base commit in CI). The 151
# findings that predate this config (revive 118, errcheck 20, staticcheck 10,
# unused 3) are a backlog to burn down, not a merge blocker.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

  settings:
    govet:
      disable:
        # Three existing findings copy a task struct that embeds task.Base
        # (archive.go, compress.go, file.go). Fixing them changes shipped code,
        # so it is a separate change; re-enable copylocks once it lands.
        - copylocks

formatters:
  enable:
    - gofmt
